<!DOCTYPE html>
<html lang="en" data-theme="dark">
    <head>
        <title>Vylen Linux :: Packages</title>

        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

        <link rel="stylesheet" href="style.css" />
    </head>

    <body>
        <div class="container">
            <main>
                <header>
                    <div class="logo">
                        <h1>Vylen Linux</h1>
                    </div>

                    <p class="subtitle">A modern Linux distribution</p>

                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value" id="total-packages">-</div>
                            <div class="stat-label">Packages</div>
                        </div>

                        <div class="stat">
                            <div class="stat-value" id="total-repos">-</div>
                            <div class="stat-label">Repos</div>
                        </div>

                        <div class="stat">
                            <div class="stat-value" id="loaded-repos">0</div>
                            <div class="stat-label">Loaded</div>
                        </div>
                    </div>
                </header>

                <div class="controls">
                    <div class="search-box">
                        <label for="search"></label>
                        <input type="text" id="search" placeholder="Search packages..." autocomplete="off" disabled />

                        <span class="search-shortcut">/</span>
                    </div>

                    <label for="sort-by"></label>

                    <select id="sort-by" disabled>
                        <option value="name">Name</option>
                        <option value="version">Version</option>
                        <option value="maintainer">Maintainer</option>
                    </select>
                </div>

                <div class="repo-tabs" id="repo-tabs"></div>

                <div id="loading" class="loading">
                    <div class="spinner"></div>
                    <p>Loading repositories...</p>
                </div>

                <div id="error" class="error hidden"></div>

                <div class="package-list hidden" id="package-list">
                    <div id="packages-container"></div>

                    <div class="scroll-sentinel hidden" id="sentinel">
                        <button class="load-more-btn">Load more</button>
                    </div>
                </div>

                <div id="empty-state" class="empty-state hidden">
                    <div class="empty-state-icon">🔍</div>

                    <h3>No packages found</h3>
                    <p>Try adjusting your search</p>
                </div>
            </main>

            <footer>
                <div class="footer-content">
                    <div class="footer-brand">
                        <div class="footer-brand-icon">
                            <img src="https://gitlab.com/vylen/artworks/-/raw/main/png/round_colored.png" alt="vylen" />
                        </div>

                        <div>
                            <div style="font-weight: 600;">Vylen Linux</div>
                            <div style="font-size: 0.75rem; color: var(--text-secondary);">Source-based, crafted with care</div>
                        </div>
                    </div>

                    <div class="footer-links">
                        <a href="https://vylen.gitlab.io/" class="footer-link" target="_blank" rel="noopener">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                            </svg>

                            Website
                        </a>

                        <a href="https://gitlab.com/vylen" class="footer-link" target="_blank" rel="noopener">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M22.65 14.39L12 22.13 1.35 14.39a.84.84 0 0 1-.3-.94l1.22-3.78 2.44-7.51A.42.42 0 0 1 4.82 2a.43.43 0 0 1 .58 0 .42.42 0 0 1 .11.18l2.44 7.49h8.1l2.44-7.51A.42.42 0 0 1 18.6 2a.43.43 0 0 1 .58 0 .42.42 0 0 1 .11.18l2.44 7.51L23 13.45a.84.84 0 0 1-.35.94z" />
                            </svg>

                            GitLab
                        </a>
                    </div>

                    <div style="font-size: 0.75rem; color: var(--text-secondary);">
                        © <span id="year"></span> Vylen Linux
                    </div>
                </div>
            </footer>
        </div>

        <div class="modal" id="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modal-title">Package</h2>
                    <button class="close-btn">&times;</button>
                </div>

                <div class="modal-body" id="modal-body"></div>
            </div>
        </div>

        <div class="toast" id="toast">Copied!</div>
        <button class="theme-toggle">🌓</button>

        <script type="module" src="dist/main.js"></script>

        <script>
            document.getElementById('year').textContent = `${new Date().getFullYear()}`;
        </script>
    </body>
</html>
